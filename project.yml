name: ResponseNYC
options:
  bundleIdPrefix: com.tenzingbhutia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETSCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
targets:
  ResponseNYC:
    type: application
    platform: iOS
    sources:
      - path: ResponseNYC
    info:
      path: ResponseNYC/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - PressStart2P-Regular.ttf
        NSPhotoLibraryAddUsageDescription: "ResponseNYC lets you attach before/after photos to a civic report."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenzingbhutia.ResponseNYC
        PRODUCT_NAME: ResponseNYC
